# Test model for time-windowed what-if scenarios — verifies
# NetworkSegment.degrade_windows and SiteGateway.constraint_windows
# (hour_windows.active_window) against the sim clock.
#
# Topology:
#   SubnetProfile -> SubnetAgg -> SiteGateway -> WAN_AWS -> ConnSink
#
# 4-hour run starting at hour 8:
#   hour 8:  baseline           (WAN 14ms / 0% loss, uplink 1 Gbps)
#   hour 9:  WAN degrade window (latency x10 -> ~140ms, 30% loss)
#   hour 10: uplink constraint  (1 Gbps -> 2 Mbps, queuing delay)
#   hour 11: recovered baseline
#
# Expected in sim-output/window_test/conn.log per-hour buckets:
#   - DROPPED messages and ~10x seg latency only in hour 9
#   - uplink congestion delay messages only in hour 10
#   - hours 8 and 11 identical-shaped baselines

DEFAULT:
  msg_size_key: bytes
  seed: 42
  sim_hours: 4
  day_type: BIZ
  base_epoch: 1736121600

ConnSink_Test:
  type: ZeekConnLogSink
  output_file: sim-output/window_test/conn.log

WAN_AWS:
  type: NetworkSegment
  segment_type: wan
  subnet: TestSubnet
  hop_depth: 4
  hop_latency_ms: 14.0
  jitter_ms: 2.0
  loss_rate: 0.0
  start_hour: 8
  degrade_windows:
    - start_hour: 9
      end_hour: 10
      latency_multiplier: 10.0
      loss_rate: 0.3
  ConnSink_Test: ~

SiteGateway_Test:
  type: SiteGateway
  site_id: test-site
  uplink_capacity_bps: 1000000000
  start_hour: 8
  constraint_windows:
    - start_hour: 10
      end_hour: 11
      capacity_bps: 2000000
  provider_prefixes:
    AWS: ["52."]
  WAN_AWS: "dc_provider == AWS"

SubnetAgg_Test:
  type: SubnetAggregator
  subnet_name: TestSubnet
  subnet_cidr: "10.0.1.0/24"
  link_capacity_bps: 100000000.0
  bandwidth_profiles:
    - day_type: BIZ
      hour: 0
      mean_bps: 40000000.0
      p95_bps: 80000000.0
      max_bps: 100000000.0
  SiteGateway_Test: ~

SubnetProfile_Test:
  type: SubnetTrafficProfile
  subnet_name: TestSubnet
  subnet_cidr: "10.0.1.0/24"
  device_count: 10
  initial_ttl: 128
  start_hour: 8
  start_node_active: true
  profiles:
    BIZ_8:
      aggregate_flow_rate: 2.0
      duration_log_mean: 1.7
      duration_log_variance: 0.6
    BIZ_9:
      aggregate_flow_rate: 2.0
      duration_log_mean: 1.7
      duration_log_variance: 0.6
    BIZ_10:
      aggregate_flow_rate: 2.0
      duration_log_mean: 1.7
      duration_log_variance: 0.6
    BIZ_11:
      aggregate_flow_rate: 2.0
      duration_log_mean: 1.7
      duration_log_variance: 0.6
  destinations:
    BIZ_8:
      - ip: "52.94.237.74"
        port: 443
        protocol: tcp
        weight: 1.0
        qos_class: AF
    BIZ_9:
      - ip: "52.94.237.74"
        port: 443
        protocol: tcp
        weight: 1.0
        qos_class: AF
    BIZ_10:
      - ip: "52.94.237.74"
        port: 443
        protocol: tcp
        weight: 1.0
        qos_class: AF
    BIZ_11:
      - ip: "52.94.237.74"
        port: 443
        protocol: tcp
        weight: 1.0
        qos_class: AF
  bytes_profiles:
    "52.94.237.74":
      bytes_log_mean: 9.0
      bytes_log_variance: 1.5
      packets_log_mean: 4.5
      packets_log_variance: 0.9
      response_ratio: 4.0
      rtt_ms_mean: 14.0
      rtt_ms_variance: 8.0
  SubnetAgg_Test: ~
