# Two-site network with 3 subnets per site using SubnetTrafficProfile
#
# Site HQ (10.1.x.0/24): Engineering, IoT, WiFi
# Site Branch (10.2.x.0/24): Development, Sales, Guest
#
# Each site has: 3 SubnetProfiles → Switch → Router → Aggregator → Sinks

DEFAULT:
  msg_size_key: bytes
  seed: 42
  sim_hours: 1
  day_type: BIZ
  base_epoch: 1736121600

# ═══════════════════════════════════════════════
# SITE HQ — Infrastructure
# ═══════════════════════════════════════════════

Router_HQ:
  type: NetworkSegment
  segment_type: router
  subnet: "HQ"
  hop_depth: 2
  hop_latency_ms: 0.6
  jitter_ms: 0.08
  loss_rate: 0.01
  Agg_HQ: ~

Switch_HQ:
  type: NetworkSegment
  segment_type: switch
  subnet: "HQ"
  hop_depth: 1
  hop_latency_ms: 0.01
  jitter_ms: 0.002
  loss_rate: 0.0
  port_count: 48
  uplink_ports: 4
  capacity_bps: 10000000000
  Router_HQ: ~

Agg_HQ:
  type: SubnetAggregator
  subnet_name: HQ
  subnet_cidr: "10.1.0.0/16"
  link_capacity_bps: 1000000000
  bandwidth_profiles:
    - day_type: BIZ
      hour: 0
      mean_bps: 500000000
      p95_bps: 800000000
      max_bps: 1000000000
  ConnLogSink: ~
  FlowSink: ~
  MatrixSink: ~

