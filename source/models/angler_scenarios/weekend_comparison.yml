# Angler Scenario — Weekend Traffic Comparison
#
# Same network as baseline.yml but simulated as a weekend (WKD) instead
# of a business day (BIZ). Traffic volumes are reduced: corporate
# workstations have lower flow rates, while IoT traffic remains constant.
#
# Compare against baseline.yml to validate that day-type differences
# in profiled models produce meaningful output variation. Any device
# that maintains BIZ-level activity on a weekend might trigger
# Angler's UNUSUAL_TIME detector.
#
# Changes from baseline:
#   - day_type changed from BIZ to WKD
#   - Corporate profiles use WKD_ prefix with reduced flow rates
#   - IoT profiles unchanged (IoT doesn't respect weekends)
#
# Usage:
#   cd astroNS/source
#   python3 astroNS/astroNS.py models/angler_scenarios/weekend_comparison.yml
#
# Output: /tmp/angler_sim/weekend/conn.log + flow_records.csv

DEFAULT:
  msg_size_key: bytes
  seed: 42
  sim_hours: 4
  day_type: WKD
  base_epoch: 1736380800  # 2025-01-09 00:00:00 UTC (Saturday — but using day_type override)

# --- Subnet Aggregators ---

SubnetAgg_Corporate:
  type: SubnetAggregator
  subnet_name: Corporate
  subnet_cidr: "192.168.1.0/24"
  bandwidth_profiles:
    - {day_type: WKD, hour: 0, mean_bps: 80000, p95_bps: 200000, max_bps: 400000}
    - {day_type: WKD, hour: 1, mean_bps: 60000, p95_bps: 150000, max_bps: 300000}
    - {day_type: WKD, hour: 2, mean_bps: 50000, p95_bps: 120000, max_bps: 250000}
    - {day_type: WKD, hour: 3, mean_bps: 40000, p95_bps: 100000, max_bps: 200000}
  ConnLogSink: ~
  FlowSink: ~

SubnetAgg_IoT:
  type: SubnetAggregator
  subnet_name: IoT
  subnet_cidr: "10.0.100.0/24"
  bandwidth_profiles:
    - {day_type: WKD, hour: 0, mean_bps: 50000, p95_bps: 150000, max_bps: 300000}
    - {day_type: WKD, hour: 1, mean_bps: 50000, p95_bps: 150000, max_bps: 300000}
    - {day_type: WKD, hour: 2, mean_bps: 50000, p95_bps: 150000, max_bps: 300000}
    - {day_type: WKD, hour: 3, mean_bps: 50000, p95_bps: 150000, max_bps: 300000}
  ConnLogSink: ~
  FlowSink: ~

# --- Corporate Workstation 1: reduced weekend traffic ---

Gen_192_168_1_10:
  type: TrafficGenerator
  device_ip: "192.168.1.10"
  subnet: Corporate
  start_node_active: true
  profiles:
    # Weekend: longer interarrival (less traffic), fewer flows
    WKD_0: {interarrival_mean: 60.0, interarrival_variance: 400.0, duration_log_mean: 1.2, duration_log_variance: 0.4, flow_count_mean: 60, sample_count: 50}
    WKD_1: {interarrival_mean: 60.0, interarrival_variance: 400.0, duration_log_mean: 1.2, duration_log_variance: 0.4, flow_count_mean: 60, sample_count: 50}
    WKD_2: {interarrival_mean: 90.0, interarrival_variance: 600.0, duration_log_mean: 1.0, duration_log_variance: 0.3, flow_count_mean: 40, sample_count: 50}
    WKD_3: {interarrival_mean: 90.0, interarrival_variance: 600.0, duration_log_mean: 1.0, duration_log_variance: 0.3, flow_count_mean: 40, sample_count: 50}
  Dest_192_168_1_10: ~

Dest_192_168_1_10:
  type: WeightedDestSelector
  device_ip: "192.168.1.10"
  destinations:
    WKD_0: &ws1_wkd_dest
      - {ip: "142.250.80.46", port: 443, protocol: tcp, weight: 0.35}
      - {ip: "151.101.1.140", port: 443, protocol: tcp, weight: 0.25}
      - {ip: "8.8.8.8", port: 53, protocol: udp, weight: 0.25}
      - {ip: "1.1.1.1", port: 53, protocol: udp, weight: 0.15}
    WKD_1: *ws1_wkd_dest
    WKD_2: *ws1_wkd_dest
    WKD_3: *ws1_wkd_dest
  Bytes_192_168_1_10: ~

Bytes_192_168_1_10:
  type: BytesSampler
  device_ip: "192.168.1.10"
  bytes_profiles:
    "142.250.80.46": {bytes_log_mean: 8.0, bytes_log_variance: 1.5, packets_log_mean: 3.5, packets_log_variance: 0.6, response_ratio: 5.0}
    "151.101.1.140": {bytes_log_mean: 7.0, bytes_log_variance: 1.0, packets_log_mean: 2.5, packets_log_variance: 0.4, response_ratio: 3.0}
    "8.8.8.8":       {bytes_log_mean: 5.5, bytes_log_variance: 0.5, packets_log_mean: 1.5, packets_log_variance: 0.3, response_ratio: 1.2}
    "1.1.1.1":       {bytes_log_mean: 5.5, bytes_log_variance: 0.5, packets_log_mean: 1.5, packets_log_variance: 0.3, response_ratio: 1.2}
  SubnetAgg_Corporate: ~

# --- Corporate Workstation 2: minimal weekend activity ---

Gen_192_168_1_20:
  type: TrafficGenerator
  device_ip: "192.168.1.20"
  subnet: Corporate
  start_node_active: true
  profiles:
    WKD_0: {interarrival_mean: 120.0, interarrival_variance: 1000.0, duration_log_mean: 0.8, duration_log_variance: 0.3, flow_count_mean: 30, sample_count: 30}
    WKD_1: {interarrival_mean: 120.0, interarrival_variance: 1000.0, duration_log_mean: 0.8, duration_log_variance: 0.3, flow_count_mean: 30, sample_count: 30}
    WKD_2: {interarrival_mean: 180.0, interarrival_variance: 2000.0, duration_log_mean: 0.6, duration_log_variance: 0.2, flow_count_mean: 20, sample_count: 20}
    WKD_3: {interarrival_mean: 180.0, interarrival_variance: 2000.0, duration_log_mean: 0.6, duration_log_variance: 0.2, flow_count_mean: 20, sample_count: 20}
  Dest_192_168_1_20: ~

Dest_192_168_1_20:
  type: WeightedDestSelector
  device_ip: "192.168.1.20"
  destinations:
    WKD_0: &ws2_wkd_dest
      - {ip: "142.250.80.46", port: 443, protocol: tcp, weight: 0.50}
      - {ip: "8.8.8.8", port: 53, protocol: udp, weight: 0.50}
    WKD_1: *ws2_wkd_dest
    WKD_2: *ws2_wkd_dest
    WKD_3: *ws2_wkd_dest
  Bytes_192_168_1_20: ~

Bytes_192_168_1_20:
  type: BytesSampler
  device_ip: "192.168.1.20"
  bytes_profiles:
    "142.250.80.46": {bytes_log_mean: 7.0, bytes_log_variance: 1.0, packets_log_mean: 2.5, packets_log_variance: 0.4, response_ratio: 3.5}
    "8.8.8.8":       {bytes_log_mean: 5.5, bytes_log_variance: 0.5, packets_log_mean: 1.5, packets_log_variance: 0.3, response_ratio: 1.2}
  SubnetAgg_Corporate: ~

# --- IoT Sensor: unchanged (IoT doesn't respect weekends) ---

Gen_10_0_100_50:
  type: TrafficGenerator
  device_ip: "10.0.100.50"
  subnet: IoT
  start_node_active: true
  profiles:
    WKD_0: &iot_profile
      interarrival_mean: 60.0
      interarrival_variance: 50.0
      duration_log_mean: 0.5
      duration_log_variance: 0.2
      flow_count_mean: 60
      sample_count: 100
    WKD_1: *iot_profile
    WKD_2: *iot_profile
    WKD_3: *iot_profile
  Dest_10_0_100_50: ~

Dest_10_0_100_50:
  type: WeightedDestSelector
  device_ip: "10.0.100.50"
  destinations:
    WKD_0: &iot_dest
      - {ip: "34.117.59.81", port: 443, protocol: tcp, weight: 0.80}
      - {ip: "8.8.8.8", port: 53, protocol: udp, weight: 0.20}
    WKD_1: *iot_dest
    WKD_2: *iot_dest
    WKD_3: *iot_dest
  Bytes_10_0_100_50: ~

Bytes_10_0_100_50:
  type: BytesSampler
  device_ip: "10.0.100.50"
  bytes_profiles:
    "34.117.59.81": {bytes_log_mean: 5.0, bytes_log_variance: 0.3, packets_log_mean: 1.5, packets_log_variance: 0.2, response_ratio: 0.5}
    "8.8.8.8":      {bytes_log_mean: 5.2, bytes_log_variance: 0.4, packets_log_mean: 1.2, packets_log_variance: 0.2, response_ratio: 1.0}
  SubnetAgg_IoT: ~

# --- Output Sinks ---

ConnLogSink:
  type: ZeekConnLogSink
  output_file: /tmp/angler_sim/weekend/conn.log

FlowSink:
  type: FlowRecordSink
  output_file: /tmp/angler_sim/weekend/flow_records.csv
