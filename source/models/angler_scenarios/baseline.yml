# Angler Simulation — Baseline Model
#
# Normal traffic from the test network. Use this as the starting point
# for what-if scenarios. Run, then compare detector output against
# modified scenario models.
#
# Usage:
#   cd astroNS/source
#   python3 astroNS/astroNS.py models/angler_scenarios/baseline.yml
#
# Output: /tmp/angler_sim/baseline/conn.log + flow_records.csv

DEFAULT:
  msg_size_key: bytes
  seed: 42
  sim_hours: 4
  day_type: BIZ
  base_epoch: 1736121600  # 2025-01-06 00:00:00 UTC (Monday)

# --- Subnet Aggregators ---

SubnetAgg_Corporate:
  type: SubnetAggregator
  subnet_name: Corporate
  subnet_cidr: "192.168.1.0/24"
  bandwidth_profiles:
    - {day_type: BIZ, hour: 0, mean_bps: 200000, p95_bps: 500000, max_bps: 1000000}
    - {day_type: BIZ, hour: 1, mean_bps: 180000, p95_bps: 450000, max_bps: 900000}
    - {day_type: BIZ, hour: 2, mean_bps: 150000, p95_bps: 400000, max_bps: 800000}
    - {day_type: BIZ, hour: 3, mean_bps: 120000, p95_bps: 350000, max_bps: 700000}
  ConnLogSink: ~
  FlowSink: ~

SubnetAgg_IoT:
  type: SubnetAggregator
  subnet_name: IoT
  subnet_cidr: "10.0.100.0/24"
  bandwidth_profiles:
    - {day_type: BIZ, hour: 0, mean_bps: 50000, p95_bps: 150000, max_bps: 300000}
    - {day_type: BIZ, hour: 1, mean_bps: 50000, p95_bps: 150000, max_bps: 300000}
    - {day_type: BIZ, hour: 2, mean_bps: 50000, p95_bps: 150000, max_bps: 300000}
    - {day_type: BIZ, hour: 3, mean_bps: 50000, p95_bps: 150000, max_bps: 300000}
  ConnLogSink: ~
  FlowSink: ~

# --- Corporate Workstation 1: heavy web user ---

Gen_192_168_1_10:
  type: TrafficGenerator
  device_ip: "192.168.1.10"
  subnet: Corporate
  start_node_active: true
  profiles:
    BIZ_0: {interarrival_mean: 15.0, interarrival_variance: 25.0, duration_log_mean: 1.5, duration_log_variance: 0.4, flow_count_mean: 240, sample_count: 100}
    BIZ_1: {interarrival_mean: 15.0, interarrival_variance: 25.0, duration_log_mean: 1.5, duration_log_variance: 0.4, flow_count_mean: 240, sample_count: 100}
    BIZ_2: {interarrival_mean: 15.0, interarrival_variance: 25.0, duration_log_mean: 1.5, duration_log_variance: 0.4, flow_count_mean: 240, sample_count: 100}
    BIZ_3: {interarrival_mean: 15.0, interarrival_variance: 25.0, duration_log_mean: 1.5, duration_log_variance: 0.4, flow_count_mean: 240, sample_count: 100}
  Dest_192_168_1_10: ~

Dest_192_168_1_10:
  type: WeightedDestSelector
  device_ip: "192.168.1.10"
  destinations:
    BIZ_0: &ws1_dest_biz
      - {ip: "13.107.42.14", port: 443, protocol: tcp, weight: 0.25}
      - {ip: "142.250.80.46", port: 443, protocol: tcp, weight: 0.20}
      - {ip: "151.101.1.140", port: 443, protocol: tcp, weight: 0.15}
      - {ip: "8.8.8.8", port: 53, protocol: udp, weight: 0.20}
      - {ip: "1.1.1.1", port: 53, protocol: udp, weight: 0.10}
      - {ip: "52.96.108.170", port: 443, protocol: tcp, weight: 0.10}
    BIZ_1: *ws1_dest_biz
    BIZ_2: *ws1_dest_biz
    BIZ_3: *ws1_dest_biz
  Bytes_192_168_1_10: ~

Bytes_192_168_1_10:
  type: BytesSampler
  device_ip: "192.168.1.10"
  bytes_profiles:
    "13.107.42.14":  {bytes_log_mean: 7.5, bytes_log_variance: 1.2, packets_log_mean: 3.0, packets_log_variance: 0.5, response_ratio: 4.0}
    "142.250.80.46": {bytes_log_mean: 8.0, bytes_log_variance: 1.5, packets_log_mean: 3.5, packets_log_variance: 0.6, response_ratio: 5.0}
    "151.101.1.140": {bytes_log_mean: 7.0, bytes_log_variance: 1.0, packets_log_mean: 2.5, packets_log_variance: 0.4, response_ratio: 3.0}
    "8.8.8.8":       {bytes_log_mean: 5.5, bytes_log_variance: 0.5, packets_log_mean: 1.5, packets_log_variance: 0.3, response_ratio: 1.2}
    "1.1.1.1":       {bytes_log_mean: 5.5, bytes_log_variance: 0.5, packets_log_mean: 1.5, packets_log_variance: 0.3, response_ratio: 1.2}
    "52.96.108.170": {bytes_log_mean: 9.0, bytes_log_variance: 2.0, packets_log_mean: 4.0, packets_log_variance: 0.8, response_ratio: 6.0}
  SubnetAgg_Corporate: ~

# --- Corporate Workstation 2: lighter user ---

Gen_192_168_1_20:
  type: TrafficGenerator
  device_ip: "192.168.1.20"
  subnet: Corporate
  start_node_active: true
  profiles:
    BIZ_0: {interarrival_mean: 45.0, interarrival_variance: 200.0, duration_log_mean: 1.0, duration_log_variance: 0.3, flow_count_mean: 80, sample_count: 50}
    BIZ_1: {interarrival_mean: 45.0, interarrival_variance: 200.0, duration_log_mean: 1.0, duration_log_variance: 0.3, flow_count_mean: 80, sample_count: 50}
    BIZ_2: {interarrival_mean: 45.0, interarrival_variance: 200.0, duration_log_mean: 1.0, duration_log_variance: 0.3, flow_count_mean: 80, sample_count: 50}
    BIZ_3: {interarrival_mean: 45.0, interarrival_variance: 200.0, duration_log_mean: 1.0, duration_log_variance: 0.3, flow_count_mean: 80, sample_count: 50}
  Dest_192_168_1_20: ~

Dest_192_168_1_20:
  type: WeightedDestSelector
  device_ip: "192.168.1.20"
  destinations:
    BIZ_0: &ws2_dest_biz
      - {ip: "142.250.80.46", port: 443, protocol: tcp, weight: 0.40}
      - {ip: "8.8.8.8", port: 53, protocol: udp, weight: 0.30}
      - {ip: "151.101.1.140", port: 443, protocol: tcp, weight: 0.30}
    BIZ_1: *ws2_dest_biz
    BIZ_2: *ws2_dest_biz
    BIZ_3: *ws2_dest_biz
  Bytes_192_168_1_20: ~

Bytes_192_168_1_20:
  type: BytesSampler
  device_ip: "192.168.1.20"
  bytes_profiles:
    "142.250.80.46": {bytes_log_mean: 7.0, bytes_log_variance: 1.0, packets_log_mean: 2.5, packets_log_variance: 0.4, response_ratio: 3.5}
    "8.8.8.8":       {bytes_log_mean: 5.5, bytes_log_variance: 0.5, packets_log_mean: 1.5, packets_log_variance: 0.3, response_ratio: 1.2}
    "151.101.1.140": {bytes_log_mean: 6.5, bytes_log_variance: 0.8, packets_log_mean: 2.0, packets_log_variance: 0.3, response_ratio: 2.5}
  SubnetAgg_Corporate: ~

# --- IoT Sensor ---

Gen_10_0_100_50:
  type: TrafficGenerator
  device_ip: "10.0.100.50"
  subnet: IoT
  start_node_active: true
  profiles:
    BIZ_0: &iot_profile
      interarrival_mean: 60.0
      interarrival_variance: 50.0
      duration_log_mean: 0.5
      duration_log_variance: 0.2
      flow_count_mean: 60
      sample_count: 100
    BIZ_1: *iot_profile
    BIZ_2: *iot_profile
    BIZ_3: *iot_profile
  Dest_10_0_100_50: ~

Dest_10_0_100_50:
  type: WeightedDestSelector
  device_ip: "10.0.100.50"
  destinations:
    BIZ_0: &iot_dest
      - {ip: "34.117.59.81", port: 443, protocol: tcp, weight: 0.80}
      - {ip: "8.8.8.8", port: 53, protocol: udp, weight: 0.20}
    BIZ_1: *iot_dest
    BIZ_2: *iot_dest
    BIZ_3: *iot_dest
  Bytes_10_0_100_50: ~

Bytes_10_0_100_50:
  type: BytesSampler
  device_ip: "10.0.100.50"
  bytes_profiles:
    "34.117.59.81": {bytes_log_mean: 5.0, bytes_log_variance: 0.3, packets_log_mean: 1.5, packets_log_variance: 0.2, response_ratio: 0.5}
    "8.8.8.8":      {bytes_log_mean: 5.2, bytes_log_variance: 0.4, packets_log_mean: 1.2, packets_log_variance: 0.2, response_ratio: 1.0}
  SubnetAgg_IoT: ~

# --- Output Sinks ---

ConnLogSink:
  type: ZeekConnLogSink
  output_file: /tmp/angler_sim/baseline/conn.log

FlowSink:
  type: FlowRecordSink
  output_file: /tmp/angler_sim/baseline/flow_records.csv
